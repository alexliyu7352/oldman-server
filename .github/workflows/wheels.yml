name: Wheels

# Builds the manylinux_2_28 wheels (CPython 3.12-3.14, x86_64 and aarch64) and
# tests each installed in a fresh environment. Called by ci.yml and release.yml;
# the wheels are uploaded as the artifacts wheels-<arch>.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # The image, and with it the compiler, is pinned (tag and digest).
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.10.22-0@sha256:076b19ef6e698f28649fa817c49d14443201e01da85240e8e52f93e8daa49bff
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.10.22-0@sha256:270a5e59af09f02dfc07fe4bb2cb2c5625c76d085cfa47f87dd93d9026eacc75
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Build the wheels
        run: scripts/build_wheels.sh dist

      - name: Test the wheels
        run: scripts/test_wheels.sh dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wheels-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  # The wheels on the distributions users run them on: manylinux allows the
  # wheels to need a few system libraries (libstdc++, libgcc_s, libz,
  # libatomic) without carrying them, which a slim image may not have.
  slim:
    name: slim images (${{ matrix.arch }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: wheels-${{ matrix.arch }}
          path: dist
      - name: Install and load the extension in python:3.x-slim
        run: |
          failed=0
          for minor in 12 13 14; do
            docker run --rm -v "$PWD/dist:/dist:ro" "python:3.$minor-slim" sh -c "
              pip install --quiet --root-user-action=ignore /dist/*-cp3$minor-*.whl &&
              python -c 'import oldman_server.native._native, oldman_server.native.engine; print(\"3.$minor ok\")'
            " || failed=1
          done
          exit $failed
