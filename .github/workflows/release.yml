name: Release

# Triggered by a tag "v<version>", where <version> is __version__ in
# src/oldman_server/__version__.py (for example v0.1.0 or v0.2.0rc1). Builds and
# tests the wheels, publishes them to PyPI through trusted publishing (OIDC, no
# stored token; the PyPI project trusts this workflow and the environment
# "pypi"), then attaches them to a GitHub release. Only wheels are published:
# building from source needs Seastar and its dependencies.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: check the tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/oldman_server/__version__.py)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ ($version)"
            exit 1
          fi
          # A pre-release (PEP 440 a, b, rc or dev) has a letter in it.
          if [[ "$version" =~ [a-z] ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  wheels:
    needs: version
    uses: ./.github/workflows/wheels.yml

  publish-pypi:
    name: publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          print-hash: true

  github-release:
    name: GitHub release
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.whl > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
