[project]
name = "oldman-server"
dynamic = ["version"]
description = "Python web framework (forked from Sanic) on a C++/Asio native HTTP host"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.12,<3.15"
# This project's license (MIT, as are Sanic, sanic-routing and sanic-testing,
# whose own are in the package), and those of the third-party code the release
# wheels carry (LICENSES/; scripts/check_wheel_licenses.py keeps the two in step).
license = "MIT AND BSD-3-Clause AND BSL-1.0"
license-files = ["LICENSE", "LICENSES/*"]
# The framework is a fork of Sanic 25.12.1 (MIT, src/oldman_server/LICENSE.sanic)
# and its router of sanic-routing 23.12.0 (MIT, src/oldman_server/routing/LICENSE.sanic-routing);
# these are its runtime requirements.
dependencies = [
    # Not on Windows, which uvloop does not support: the asyncio server runs
    # on its default selector loop there.
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "httptools>=0.0.10",
    # json() and request.json (the default dumps/loads).
    "orjson>=3.10.0",
    "aiofiles>=0.6.0",
    "websockets>=13.0",
    "multidict>=5.0,<7.0",
    "html5tagger>=1.2.1",
    "tracerite>=2.2.0",
    "typing-extensions>=4.4.0",
]

[project.urls]
Repository = "https://github.com/alexliyu7352/oldman-server"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/oldman_server/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oldman_server"]

# hatch_build.py: a wheel carries the native extension built in the tree, and
# is not built without it (unless OLDMAN_SERVER_PURE_WHEEL=1).
[tool.hatch.build.targets.wheel.hooks.custom]

# Only the public sources needed to build. An explicit list: the working tree
# also holds private material that git excludes through .git/info/exclude,
# which hatchling does not read (tests/test_packaging.py).
[tool.hatch.build.targets.sdist]
only-include = [
    "src", "native", "upstream", "LICENSES", "CMakeLists.txt", "hatch_build.py",
    "dependency-lock.json", "scripts/build_wheels.sh", "scripts/fetch_sources.py",
]

[dependency-groups]
build = ["cmake==4.4.3", "ninja==1.13.2", "pybind11==3.1.0"]
http = ["aiohttp==3.13.5"]
# tests/framework (from Sanic's suite) also needs httpx (the test client).
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-timeout==2.4.0", "pytest-benchmark==5.3.0",
        "httpx==0.28.1", "beautifulsoup4==4.15.0", {include-group = "http"}]
# ujson: stock Sanic's json() encoder in the comparison with stock Sanic.
benchmark = ["ujson==6.0.0", {include-group = "http"}]

[tool.uv]
default-groups = ["build", "test", "benchmark"]
# Preserve the existing dependency versions during the interpreter migration;
# uvloop 0.22.1 is the version the tests' strict expectations describe.
constraint-dependencies = [
    "uvloop==0.22.1",
    "aiohappyeyeballs==2.7.1",
    "aiosignal==1.4.0",
    "attrs==26.1.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "iniconfig==2.3.0",
    "multidict==6.9.1",
    "packaging==26.3",
    "pluggy==1.6.0",
    "propcache==0.5.4",
    "pygments==2.21.0",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
# Async tests and fixtures need no marker, as the suites that came from Sanic expect.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test that never stops its server must not stall the run.
timeout = 60
markers = ["xdist_group(name): run on the same worker as others with the same group name"]
filterwarnings = [
    "ignore:.*async with lock.* instead:DeprecationWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
